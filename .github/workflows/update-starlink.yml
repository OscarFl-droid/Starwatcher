name: Update Starlink catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download current CelesTrak Starlink data
        run: |
          mkdir -p data
          curl --fail --location \
            "https://celestrak.org/NORAD/elements/gp.php?GROUP=STARLINK&FORMAT=JSON" \
            -o /tmp/starlink.json

          python3 - <<'PY'
          import json
          import datetime
          import pathlib

          data = json.loads(pathlib.Path("/tmp/starlink.json").read_text())

          if not isinstance(data, list) or len(data) < 100:
              raise SystemExit("Invalid CelesTrak response")

          output = {
              "meta": {
                  "source": "CelesTrak",
                  "fetched_at": datetime.datetime.now(
                      datetime.timezone.utc
                  ).isoformat(),
                  "count": len(data)
              },
              "objects": data
          }

          pathlib.Path("data/starlink.json").write_text(
              json.dumps(output, separators=(",", ":"))
          )
          PY

      - name: Commit updated catalogue
        run: |
          git config user.name "StarWatcher data bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/starlink.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Starlink catalogue"
          git push
